apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  annotations:
    networking.gke.io/managed-certificates: "n8n-managed-cert"
    kubernetes.io/ingress.global-static-ip-name: "n8n-static-ip"
spec:
  ingressClassName: "gce"
  rules:
  - host: n8n.notboardco.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n
            port:
              number: 5678
