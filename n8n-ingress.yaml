apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  annotations:
    kubernetes.io/ingress.allow-http: "true"
    networking.gke.io/managed-certificates: "n8n-managed-cert"
    kubernetes.io/ingress.global-static-ip-name: "n8n-static-ip"
    networking.gke.io/force-ssl-redirect: "true"
spec:
  ingressClassName: "gce"
  tls:
    - hosts:
        - n8n.notboardco.com
      # The secretName is a placeholder; GCE will use the ManagedCertificate instead.
      secretName: n8n-tls-dummy
  rules:
    - host: n8n.notboardco.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
